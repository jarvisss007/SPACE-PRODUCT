name: Refresh satellite data

# Every day, download fresh public orbits from CelesTrak, update the
# Satellite Watch, rebuild the website and publish it. Runs on GitHub's
# servers; nothing needs to be switched on at home.
on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC daily (07:47 in India)
  workflow_dispatch: {}      # the "Run workflow" button, for a refresh on demand

permissions:
  contents: write

concurrency:
  group: refresh-satellites
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download fresh orbits
        run: python tools/refresh_tle.py
      - name: Download fresh asteroid data
        run: python tools/refresh_neo.py
      - name: Download this year's launch log
        run: python tools/refresh_launches.py
      - name: Rebuild the website
        run: python build_site.py
      - name: Publish if anything changed
        run: |
          git config user.name "golapada-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html site docs
          if git diff --cached --quiet; then
            echo "Nothing new today."
          else
            git commit -m "Refresh satellite, asteroid and launch data ($(date -u +%Y-%m-%d))"
            git push
          fi
